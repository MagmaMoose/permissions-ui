# permissions-ui. Required: azure.tenantId, azure.clientId, config.publicOrigin and
# catalog.repository with a GitHub credential. The setup is in the repository README.

replicaCount: 2

image:
  repository: ghcr.io/magmamoose/permissions-ui
  # Defaults to the chart's appVersion.
  tag: ""
  # sha256:..., pins the image whatever the tag says.
  digest: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

azure:
  # The Entra ID tenant (a GUID) and the app registration's client id. One app signs people in
  # and reads Microsoft Graph (User.Read.All, GroupMember.Read.All).
  tenantId: ""
  clientId: ""
  # Leave empty for the public cloud (https://login.microsoftonline.com).
  authorityHost: ""
  # The app authenticates with its own service-account token, which Entra ID accepts through a
  # federated credential (issuer: the cluster's service-account issuer, subject:
  # system:serviceaccount:<namespace>:<service account>). No secret to store or rotate.
  workloadIdentity:
    enabled: true
    audience: api://AzureADTokenExchange
  # Used instead when workloadIdentity.enabled is false: a Secret holding a client secret.
  clientSecret:
    existingSecret: ""
    key: client-secret

config:
  # Where people open the UI, scheme and host only. The redirect URI to register on the app is
  # <publicOrigin>/auth/callback.
  publicOrigin: ""
  # How long a sign-in lasts, 1 to 24.
  sessionHours: 8
  # pull-request: approved requests merge into the catalog repository and its pipeline applies
  # them. graph: the app also changes the Entra ID groups itself, which needs
  # GroupMember.ReadWrite.All (or Groups Administrator over an administrative unit).
  fulfilment: pull-request
  # auto: the app merges a request once it is approved. manual: people merge it.
  merge: auto
  # Group name prefixes to check for groups no resource describes, such as ["acl-", "k8s-"].
  groupPrefixes: []
  # The app roles that see everyone's access: Admin also removes anyone's; Auditor only reads.
  adminRole: Admin
  auditorRole: Auditor

catalog:
  # The repository that holds the catalog (owner/name), its branch, and the folder in it.
  repository: ""
  branch: main
  path: ""
  # https://api.github.com, or https://<host>/api/v3 for GitHub Enterprise Server.
  apiUrl: https://api.github.com
  # A GitHub App installed on that repository only, with contents, pull requests and issues
  # read-write (preferred), or a token. Each from a Secret.
  app:
    id: ""
    privateKey:
      existingSecret: ""
      key: private-key
  token:
    existingSecret: ""
    key: token
  # Whose comments count as this app's approval records; found out by itself when empty.
  bot: ""

notifications:
  # A Teams workflow's webhook URL ("When a Teams webhook request is received"), from a Secret.
  teams:
    existingSecret: ""
    key: webhook-url

# Opens and merges a removal for every grant that expired, once a day.
expiry:
  enabled: true
  schedule: "17 5 * * *"
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      memory: 192Mi

# Your colours, as quoted "#rrggbb"; empty keeps the default. The accent fills buttons, links, the
# selected page and the logo; accentText is the text on it. The dark ones default to these two.
branding:
  accent: ""
  accentText: ""
  accentDark: ""
  accentTextDark: ""

session:
  # A Secret holding the key that seals session cookies (at least 32 characters), shared by
  # every replica. Empty: the chart creates one on install and keeps it on upgrade.
  existingSecret: ""
  key: session-key

serviceAccount:
  create: true
  # Defaults to the release's full name. It is the subject of the federated credential.
  name: ""
  annotations: {}

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  className: ""
  annotations: {}
  # Defaults to the host of config.publicOrigin.
  host: ""
  tls:
    # The TLS Secret for the host; empty for no tls block.
    secretName: ""

podDisruptionBudget:
  enabled: true
  minAvailable: 1

# One replica per node where possible. DoNotSchedule makes it strict.
topologySpread:
  enabled: true
  whenUnsatisfiable: ScheduleAnyway
  # Honor keeps tainted nodes out of the count; empty leaves the Kubernetes default.
  nodeTaintsPolicy: ""
# Or your own constraints, rendered as they are instead of the one above.
topologySpreadConstraints: []

networkPolicy:
  # Ingress to the http port from ingressFrom (any pod when empty); egress to DNS and to public
  # addresses on 443 (Entra ID, Microsoft Graph, GitHub, Teams).
  enabled: false
  ingressFrom: []
  # More egress rules, rendered as they are: GitHub Enterprise Server on a private address needs one.
  extraEgress: []

resources:
  requests:
    cpu: 10m
    memory: 96Mi
  limits:
    memory: 256Mi

priorityClassName: ""
podLabels: {}
podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}
extraEnv: []
