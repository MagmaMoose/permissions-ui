{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "permissions-ui.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "permissions-ui.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  rules:
    - host: {{ include "permissions-ui.host" . }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "permissions-ui.fullname" . }}
                port:
                  name: http
  {{- with .Values.ingress.tls.secretName }}
  tls:
    - hosts:
        - {{ include "permissions-ui.host" $ }}
      secretName: {{ . }}
  {{- end }}
{{- end }}
