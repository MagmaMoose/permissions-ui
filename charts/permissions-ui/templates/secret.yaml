{{- if not .Values.session.existingSecret }}
{{- $name := include "permissions-ui.sessionSecret" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
# The key that seals session cookies. Generated once and kept: a new key signs everyone out.
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "permissions-ui.labels" . | nindent 4 }}
type: Opaque
data:
  {{ .Values.session.key }}: {{ if and $existing (index $existing.data .Values.session.key) }}{{ index $existing.data .Values.session.key }}{{ else }}{{ randAlphaNum 64 | b64enc }}{{ end }}
{{- end }}
{{- if not .Values.records.existingSecret }}
{{- $name := include "permissions-ui.recordsSecret" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
---
# The key that signs the app's records on pull requests. Generated once and kept, through an
# uninstall too: a new key drops every request the old one signed from the portal.
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "permissions-ui.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{ .Values.records.key }}: {{ if and $existing (index $existing.data .Values.records.key) }}{{ index $existing.data .Values.records.key }}{{ else }}{{ randAlphaNum 64 | b64enc }}{{ end }}
{{- end }}
