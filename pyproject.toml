[project]
name = "permissions-ui"
# The release version lives in the git tag and reaches the image as APP_VERSION.
version = "0.0.0"
description = "See and manage who has access to what: people request access, the right person approves, Git records every grant and Entra ID enforces it"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.140",
    "uvicorn>=0.50",
    "httpx>=0.28",
    "pyjwt[crypto]>=2.10",
    "cryptography>=45",
    "pyyaml>=6.0.2",
]

[project.scripts]
permissions-ui = "permissions_ui.__main__:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=6"]

[build-system]
requires = ["uv_build>=0.11,<0.13"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error::DeprecationWarning:permissions_ui.*"]
